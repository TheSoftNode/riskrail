services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: riskrail
      POSTGRES_PASSWORD: riskrail
      POSTGRES_DB: riskrail
    ports:
      - "5432:5432"
    volumes:
      - riskrail-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U riskrail -d riskrail"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - riskrail-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  riskrail-postgres:
  riskrail-redis:
