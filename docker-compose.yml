services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rivisk
      POSTGRES_PASSWORD: rivisk
      POSTGRES_DB: rivisk
    ports:
      - "5432:5432"
    volumes:
      - rivisk-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rivisk -d rivisk"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - rivisk-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  rivisk-postgres:
  rivisk-redis:
