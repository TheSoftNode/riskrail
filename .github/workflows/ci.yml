name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: corepack prepare pnpm@10.17.1 --activate
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

      # apps/web is npm-managed and excluded from the pnpm workspace,
      # so the turbo tasks above never reach it.
      - run: npm ci
        working-directory: apps/web
      - run: npm run typecheck
        working-directory: apps/web
      - run: npm run build
        working-directory: apps/web

  # Migrations are what production gets, so they are checked against a real
  # Postgres rather than trusted because they were generated correctly once.
  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rivisk_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rivisk_ci
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: corepack prepare pnpm@10.17.1 --activate
      - run: pnpm install --no-frozen-lockfile

      - name: Apply migrations from empty
        run: pnpm --filter @rivisk/database exec prisma migrate deploy --schema prisma/schema.prisma

      # Catches the common mistake of editing schema.prisma without generating
      # the matching migration: the code would work locally against a pushed
      # schema and then fail on a deployed database. --exit-code makes any
      # difference a build failure.
      - name: Fail if schema.prisma has drifted from the migrations
        run: >-
          pnpm --filter @rivisk/database exec prisma migrate diff
          --from-url "$DATABASE_URL"
          --to-schema-datamodel prisma/schema.prisma
          --exit-code
